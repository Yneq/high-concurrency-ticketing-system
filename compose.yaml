services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticketing
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin}
      LEGACY_ENABLED: ${LEGACY_ENABLED:-false}
      CONSUMER_ENABLED: ${CONSUMER_ENABLED:-true}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      RACE_WINDOW_MS: ${RACE_WINDOW_MS:-50}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]
    volumes:
      - ./load-test:/scripts:ro
      - ./load-test/results:/results
    environment:
      BASE_URL: http://app:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin}
    command: ["run", "/scripts/final.js"]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
