services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticketing
      RACE_WINDOW_MS: ${RACE_WINDOW_MS:-50}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]
    volumes:
      - ./load-test:/scripts:ro
    environment:
      BASE_URL: http://app:8080
    command: ["run", "/scripts/reserve.js"]
volumes:
  postgres-data:
