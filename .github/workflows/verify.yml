name: Ticketing verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, integration, Compose and 1000-request admission verification
        run: bash scripts/acceptance.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            load-test/results/
            target/surefire-reports/
            verification/core/target/surefire-reports/
          retention-days: 7
      - name: Stop local verification services
        if: always()
        run: docker compose down -v
