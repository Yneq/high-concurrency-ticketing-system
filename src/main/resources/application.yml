spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 4000
        request.timeout.ms: 2000
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
server:
  error:
    include-message: always
  tomcat:
    threads:
      max: 200
    accept-count: 1500
    max-connections: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
ticketing:
  admin-token: ${ADMIN_TOKEN:}
  legacy-enabled: ${LEGACY_ENABLED:false}
  redis-enabled: ${REDIS_ENABLED:true}
  consumer-enabled: ${CONSUMER_ENABLED:true}
  reservation-ttl-seconds: ${RESERVATION_TTL_SECONDS:300}
  race-window-ms: ${RACE_WINDOW_MS:50}
